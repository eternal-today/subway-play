<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
<meta name="theme-color" content="#14213D" />
<title>지하철 놀이</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-mode="line">

<header class="topbar">
  <div class="brand">
    <span class="brand-badge" id="brandBadge">6</span>
    <span class="brand-name">지하철 놀이</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-mode="line" role="tab">🚇 노선</button>
    <button class="tab" data-mode="trip" role="tab">🧭 여행</button>
    <button class="tab" data-mode="quiz" role="tab">🎮 퀴즈</button>
    <button class="tab" data-mode="chosung" role="tab">🔤 초성</button>
  </nav>
  <div class="tools">
    <button class="tool" id="riddenBtn" title="내가 탄 호선">🎫</button>
    <button class="tool" id="settingsBtn" title="설정">⚙️</button>
  </div>
</header>

<main class="stage">
  <!-- 왼쪽: 노선도 -->
  <section class="rail">
    <div class="rail-head">
      <div class="line-chips" id="lineChips"></div>
      <div class="rail-title" id="railTitle"></div>
    </div>
    <div class="map" id="map"></div>
  </section>

  <!-- 오른쪽: 열차 안 -->
  <section class="cab">
    <div class="led"><span class="led-text" id="ledText"></span></div>

    <div class="platform">
      <div class="sign" id="sign">
        <div class="sign-top">
          <span class="sign-badge" id="signBadge"></span>
          <div class="sign-names">
            <div class="sign-name" id="signName"></div>
            <div class="sign-en" id="signEn"></div>
          </div>
          <div class="sign-tr" id="signTr"></div>
        </div>
        <div class="sign-band">
          <span class="sign-prev" id="signPrev"></span>
          <span class="sign-dir" id="signDir"></span>
          <span class="sign-next" id="signNext"></span>
        </div>
      </div>
      <div class="doors" id="doors" aria-hidden="true">
        <div class="door left"><i></i></div>
        <div class="door right"><i></i></div>
      </div>
    </div>

    <div class="strip" id="strip"></div>

    <!-- 노선 모드: 자동운행 -->
    <div class="panel panel-line">
      <div class="run-row">
        <label class="field"><span>출발</span><select id="autoStart"></select></label>
        <button class="swap" id="autoSwap" title="출발·도착 바꾸기">⇄</button>
        <label class="field"><span>도착</span><select id="autoEnd"></select></label>
        <button class="go" id="autoGo">▶ 자동운행</button>
      </div>
      <p class="hint">역을 누르면 안내방송이 나와요. 다시 누르면 멈춰요.</p>
    </div>

    <!-- 여행 모드 -->
    <div class="panel panel-trip">
      <div class="trip-ends">
        <button class="end-btn" id="tripFrom"><small>출발</small><b>역 고르기</b></button>
        <button class="swap" id="tripSwap" title="출발·도착 바꾸기">⇄</button>
        <button class="end-btn" id="tripTo"><small>도착</small><b>역 고르기</b></button>
        <button class="go" id="tripGo" disabled>▶ 출발</button>
      </div>
      <div class="route" id="routeCard"></div>
      <div class="recent" id="recentTrips"></div>
    </div>

    <div class="run-status" id="runStatus"></div>
  </section>

  <!-- 퀴즈 화면 -->
  <section class="quiz" id="quizView"></section>
</main>

<button class="stop-fab" id="stopBtn">■ 멈추기</button>

<!-- 환승 연출 -->
<div class="overlay" id="transferOverlay">
  <div class="transfer-card">
    <div class="transfer-lines"><span id="trFrom"></span><span class="walker">🚶</span><span id="trTo"></span></div>
    <div class="transfer-title" id="trTitle"></div>
    <div class="transfer-sub" id="trSub"></div>
    <div class="footsteps"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</div>

<!-- 도착 축하 -->
<div class="overlay" id="arriveOverlay">
  <div class="arrive-card">
    <div class="arrive-emoji">🎉</div>
    <div class="arrive-title" id="arriveTitle"></div>
    <div class="arrive-sub" id="arriveSub"></div>
    <button class="go" id="arriveOk">좋아요!</button>
  </div>
</div>

<!-- 역 고르기 -->
<div class="sheet-overlay" id="pickerOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <b id="pickerTitle">출발역 고르기</b>
      <button class="sheet-close" data-close="pickerOverlay">✕</button>
    </div>
    <input class="picker-search" id="pickerSearch" type="search" placeholder="역 이름이나 초성으로 찾기 (예: ㄱㄴ)" autocomplete="off" />
    <div class="picker-lines" id="pickerLines"></div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<!-- 내가 탄 호선 -->
<div class="sheet-overlay" id="riddenOverlay">
  <div class="sheet narrow">
    <div class="sheet-head">
      <b>🎫 내가 탄 호선</b>
      <button class="sheet-close" data-close="riddenOverlay">✕</button>
    </div>
    <p class="sheet-desc">실제로 타본 호선을 켜주세요. 켠 호선은 노선 버튼과 왼쪽 위 동그라미에 ⭐이 붙어요.</p>
    <div id="riddenList"></div>
  </div>
</div>

<!-- 설정 -->
<div class="sheet-overlay" id="settingsOverlay">
  <div class="sheet narrow">
    <div class="sheet-head">
      <b>⚙️ 설정</b>
      <button class="sheet-close" data-close="settingsOverlay">✕</button>
    </div>
    <div class="set-group">
      <label class="set-row"><span>한국어 목소리</span><select id="setKoVoice"></select></label>
      <label class="set-row"><span>영어 목소리</span><select id="setEnVoice"></select></label>
      <div class="set-row"><span>말 빠르기</span>
        <div class="seg" id="setRate">
          <button data-v="0.85">느리게</button><button data-v="1">보통</button><button data-v="1.2">빠르게</button>
        </div>
      </div>
      <div class="set-row"><span>영어 방송</span><button class="toggle" id="setEnglish"></button></div>
      <div class="set-row"><span>영어 방송 속 역 이름을<br><small>한국어 목소리로 읽기</small></span><button class="toggle" id="setEnNameKo"></button></div>
      <div class="set-row"><span>안전 안내방송 (가끔)</span><button class="toggle" id="setSafety"></button></div>
      <button class="go wide" id="setTest">🔊 들어보기</button>
    </div>
    <p class="sheet-desc" id="installHint">목소리가 어색하면 다른 목소리를 골라보세요. 기기마다 들어있는 목소리가 달라요.</p>
    <button class="go wide ghost" id="installBtn" hidden>📲 홈 화면에 앱으로 설치</button>
  </div>
</div>

<script src="lines.js"></script>
<script src="network.js"></script>
<script src="voice.js"></script>
<script src="quiz.js"></script>
<script src="app.js"></script>
</body>
</html>
